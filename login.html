<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập – Davines Việt Nam</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/brand/favicon.svg">
  <link rel="icon" type="image/png" href="assets/img/brand/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/brand/apple-touch-icon.png">
  <link rel="stylesheet" href="assets/css/style.css?v=20261111b">
</head>
<body>
  <main class="container">
    <div class="auth">
      <div class="auth-tabs" id="tabs" role="tablist">
        <button type="button" role="tab" data-tab="customer">Khách hàng</button>
        <button type="button" role="tab" data-tab="admin">Quản trị</button>
      </div>
      <div id="app"></div>
    </div>
  </main>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/store.js?v=20261111b"></script>
  <script src="assets/js/ui.js?v=20261111b"></script>
  <script>
    UI.header("account");
    UI.footer();
    const { V } = UI;
    // BR-TK11: đăng nhập xong quay về trang người dùng định vào trước đó (chỉ trang thuộc website), nếu không thì về trang chủ.
    function safeNext(raw) {
      if (!raw) return "";
      try {
        const u = new URL(raw, location.href);
        const file = u.pathname.split("/").pop();
        const sameDir = u.pathname.slice(0, u.pathname.lastIndexOf("/")) === location.pathname.slice(0, location.pathname.lastIndexOf("/"));
        if (u.origin !== location.origin || !sameDir || !/^[a-z-]+\.html$/i.test(file) || file === "login.html") return "";
        return file + u.search + u.hash;
      } catch (e) { return ""; }
    }
    const next = safeNext(UI.qs("next")) || safeNext(document.referrer) || "index.html";
    if (Store.currentAdmin()) location.replace("admin/index.html");
    else if (Store.currentUser()) location.replace(next);
    const app = UI.$("#app");
    // 2 tab trên cùng một màn hình đăng nhập: Khách hàng (đăng nhập / đăng ký) và Quản trị (chỉ đăng nhập)
    function setTab(t) {
      UI.$$("#tabs [data-tab]").forEach((b) => { const on = b.dataset.tab === t; b.classList.toggle("on", on); b.setAttribute("aria-selected", on); });
    }
    UI.$$("#tabs [data-tab]").forEach((b) => (b.onclick = () => (b.dataset.tab === "admin" ? adminView() : loginView())));

    function adminView() {
      setTab("admin");
      history.replaceState(null, "", "login.html?tab=admin");
      app.innerHTML = `
        <h1>Đăng nhập quản trị</h1>
        <p class="muted">Chỉ dành cho tài khoản quản trị do Davines cấp. Không hỗ trợ tự đăng ký.</p>
        <form id="f" novalidate>
          <div class="field"><label for="email">Email quản trị</label><input class="input" id="email" name="email" type="email" autocomplete="username"></div>
          <div class="field"><label for="pass">Mật khẩu</label><input class="input" id="pass" name="pass" type="password" autocomplete="current-password"></div>
          <button class="btn btn-block">Đăng nhập quản trị</button>
        </form>`;
      const f = UI.$("#f");
      f.onsubmit = (e) => {
        e.preventDefault();
        if (!UI.validate(f, { email: [V.required("email"), V.email], pass: [V.required("mật khẩu")] })) return;
        const r = Store.adminLogin(f.email.value, f.pass.value);
        if (!r.ok) { f.pass.value = ""; setErr(f.pass, UI.esc(r.error)); return; }
        location.href = "admin/index.html";
      };
    }
    const setErr = (input, msg) => { const fld = input.closest(".field"); fld.classList.add("error"); let e = fld.querySelector(".err"); if (!e) { e = document.createElement("div"); e.className = "err"; fld.append(e); } e.innerHTML = msg; };

    function loginView(prefill, notice) {
      setTab("customer");
      history.replaceState(null, "", "login.html" + (UI.qs("next") ? "?next=" + encodeURIComponent(UI.qs("next")) : ""));
      app.innerHTML = `
        <h1>Đăng nhập</h1>
        <p class="muted">Đăng nhập để lưu giỏ hàng, địa chỉ và theo dõi đơn hàng.</p>
        ${notice ? `<div class="box" style="margin-bottom:16px;border-color:var(--c-success, #3c763d)">${notice}</div>` : ""}
        <form id="f" novalidate>
          <div class="field"><label for="email">Email</label><input class="input" id="email" name="email" type="email" autocomplete="email" value="${UI.esc(prefill || "")}"></div>
          <div class="field"><label for="pass">Mật khẩu</label><input class="input" id="pass" name="pass" type="password" autocomplete="current-password"></div>
          <p style="text-align:right;margin:-6px 0 16px"><button type="button" class="link small" id="forgot">Quên mật khẩu?</button></p>
          <button class="btn btn-block">Đăng nhập</button>
        </form>
        <p style="text-align:center" class="small">Chưa có tài khoản? <button class="link" id="to-reg">Đăng ký</button></p>`;
      const f = UI.$("#f");
      if (prefill) f.pass.focus();
      f.onsubmit = (e) => {
        e.preventDefault();
        if (!UI.validate(f, { email: [V.required("email"), V.email], pass: [V.required("mật khẩu")] })) return;
        // Tab Khách hàng chỉ nhận tài khoản khách hàng; tài khoản quản trị phải đăng nhập ở tab Quản trị
        const em = f.email.value.trim().toLowerCase();
        if (Store.db.admins.some((a) => a.email.toLowerCase() === em)) { f.pass.value = ""; setErr(f.email, "Đây là tài khoản quản trị. Hãy đăng nhập ở tab Quản trị."); return; }
        const r = Store.login(f.email.value, f.pass.value);
        if (!r.ok) { f.pass.value = ""; setErr(f.pass, UI.esc(r.error)); return; }
        location.href = next;
      };
      UI.$("#to-reg").onclick = () => registerView();
      UI.$("#forgot").onclick = () => forgot(f.email.value.trim());
    }

    // UC07: chỉ gửi liên kết khi email đã đăng ký; chưa đăng ký thì báo "Email chưa được đăng ký".
    // Web tĩnh không có máy chủ gửi mail -> hiển thị email trong "hộp thư mô phỏng" để thử luồng đặt lại mật khẩu.
    function sentView(r) {
      const link = `login.html?reset=${r.token}`;
      const sm = UI.modal(`<h3>Đã gửi liên kết đặt lại mật khẩu</h3><p class="muted small">Liên kết đã được gửi tới <b>${UI.esc(r.email)}</b>, có hiệu lực trong 30 phút và chỉ dùng được một lần.</p>
        <div class="box small"><div class="eyebrow">Hộp thư (mô phỏng)</div><p><b>Davines Việt Nam – Đặt lại mật khẩu</b></p><p>Bấm vào liên kết sau để đặt mật khẩu mới:</p><a class="link" href="${link}">Đặt lại mật khẩu</a></div>
        <div class="err" id="resend-msg" role="alert" style="margin-top:10px"></div>
        <div class="modal-actions"><button class="btn btn-outline" id="resend" type="button">Gửi lại liên kết</button><button class="btn btn-outline" data-close>Đóng</button></div>`);
      UI.$("#resend", sm.el).onclick = () => {
        const r2 = Store.requestReset(r.email);
        if (!r2.ok) { UI.$("#resend-msg", sm.el).textContent = r2.error; return; }
        sm.close(); sentView(r2);
      };
    }
    function forgot(email) {
      const m = UI.modal(`<h3>Quên mật khẩu</h3><p class="muted small">Nhập email tài khoản, chúng tôi sẽ gửi liên kết đặt lại mật khẩu.</p><form id="ff" novalidate><div class="field"><input class="input" name="email" type="email" placeholder="Email" value="${UI.esc(email || "")}"></div><div class="modal-actions"><button class="btn">Gửi liên kết</button><button type="button" class="btn btn-outline" data-close>Đóng</button></div></form>`);
      UI.$("#ff", m.el).onsubmit = (e) => {
        e.preventDefault();
        const ff = e.target;
        if (!UI.validate(ff, { email: [V.required("email"), V.email] })) return;
        const r = Store.requestReset(ff.email.value);
        if (!r.ok) {
          if (!r.notRegistered) return setErr(ff.email, UI.esc(r.error)); // quá nhanh hoặc quá 5 lần/giờ: báo thời điểm được gửi lại
          return setErr(ff.email, `${UI.esc(r.error)} <button type="button" class="link small" id="ff-reg">Đăng ký tài khoản</button>`), (UI.$("#ff-reg", m.el).onclick = () => { m.close(); registerView(ff.email.value.trim()); });
        }
        m.close();
        sentView(r);
      };
    }

    function resetView(token) {
      setTab("customer");
      const u = Store.resetInfo(token);
      if (!u) return loginView("", `<b>Liên kết đặt lại mật khẩu không hợp lệ hoặc đã hết hạn.</b> Vui lòng yêu cầu liên kết mới.`);
      app.innerHTML = `
        <h1>Đặt lại mật khẩu</h1>
        <p class="muted">Tài khoản: <b>${UI.esc(u.email)}</b></p>
        <form id="f" novalidate>
          <div class="field"><label for="pass">Mật khẩu mới</label><input class="input" id="pass" name="pass" type="password" autocomplete="new-password"></div>
          <div class="field"><label for="pass2">Nhập lại mật khẩu mới</label><input class="input" id="pass2" name="pass2" type="password" autocomplete="new-password"></div>
          <button class="btn btn-block">Lưu mật khẩu mới</button>
        </form>`;
      const f = UI.$("#f");
      f.onsubmit = (e) => {
        e.preventDefault();
        if (!UI.validate(f, { pass: [V.required("mật khẩu mới"), V.password], pass2: [(v) => (v ? "" : "Vui lòng nhập lại mật khẩu."), (v) => (v === f.pass.value ? "" : "Mật khẩu nhập lại không khớp.")] })) return;
        const r = Store.resetPassword(token, f.pass.value);
        if (!r.ok) return loginView("", UI.esc(r.error));
        loginView(r.email, "Đã đặt lại mật khẩu. Vui lòng đăng nhập bằng mật khẩu mới.");
      };
    }

    function registerView(prefillEmail) {
      setTab("customer");
      app.innerHTML = `
        <h1>Đăng ký</h1>
        <p class="muted">Tạo tài khoản thành viên Davines.</p>
        <form id="f" novalidate>
          <div class="field"><label for="name">Họ và tên</label><input class="input" id="name" name="name" autocomplete="name"></div>
          <div class="field"><label for="email">Email (tên đăng nhập)</label><input class="input" id="email" name="email" type="email" autocomplete="email" value="${UI.esc(prefillEmail || "")}"></div>
          <div class="field"><label for="phone">Số điện thoại</label><input class="input" id="phone" name="phone" autocomplete="tel"></div>
          <div class="field"><label for="pass">Mật khẩu</label><input class="input" id="pass" name="pass" type="password" autocomplete="new-password"></div>
          <div class="field"><label for="pass2">Nhập lại mật khẩu</label><input class="input" id="pass2" name="pass2" type="password" autocomplete="new-password"></div>
          <div class="field" style="margin-bottom:16px"><label class="check"><input type="checkbox" name="agree"> Tôi đồng ý với điều khoản sử dụng và chính sách bảo mật</label></div>
          <button class="btn btn-block">Tạo tài khoản</button>
        </form>
        <p style="text-align:center" class="small">Đã có tài khoản? <button class="link" id="to-login">Đăng nhập</button></p>`;
      const f = UI.$("#f");
      f.onsubmit = (e) => {
        e.preventDefault();
        const ok = UI.validate(f, {
          name: [V.required("họ tên")], email: [V.required("email"), V.email], phone: [V.required("số điện thoại"), V.phone],
          pass: [V.required("mật khẩu"), V.password], pass2: [(v) => (v ? "" : "Vui lòng nhập lại mật khẩu."), (v) => (v === f.pass.value ? "" : "Mật khẩu nhập lại không khớp.")],
          agree: [() => (f.agree.checked ? "" : "Vui lòng đồng ý với điều khoản sử dụng.")],
        });
        if (!ok) return;
        const r = Store.register({ name: f.name.value, email: f.email.value, phone: f.phone.value, pass: f.pass.value });
        if (r.saveFailed) { // lưu không được: không tạo tài khoản, giữ thông tin đã nhập trừ mật khẩu
          f.pass.value = ""; f.pass2.value = "";
          setErr(f.pass, UI.esc(r.error));
          return;
        }
        if (!r.ok) {
          // BR-TK07 / UC04 EF2: email đã tồn tại -> gợi ý Đăng nhập hoặc Quên mật khẩu
          setErr(f[r.field], `${UI.esc(r.error)} Bạn có thể <button type="button" class="link small" id="dup-login">Đăng nhập</button> hoặc <button type="button" class="link small" id="dup-forgot">Quên mật khẩu</button>.`);
          const em = f.email.value.trim();
          UI.$("#dup-login").onclick = () => loginView(em);
          UI.$("#dup-forgot").onclick = () => { loginView(em); forgot(em); };
          return;
        }
        // BR-TK04: đăng ký xong không tự đăng nhập -> chuyển sang Đăng nhập, điền sẵn email
        loginView(r.user.email, "<b>Đăng ký thành công!</b> Vui lòng đăng nhập bằng email và mật khẩu vừa tạo.");
        window.scrollTo({ top: 0, behavior: "smooth" });
      };
      UI.$("#to-login").onclick = () => loginView();
    }

    if (UI.qs("reset")) resetView(UI.qs("reset"));
    else if (UI.qs("tab") === "admin") adminView();
    else if (UI.qs("mode") === "register") registerView();
    else loginView(undefined, UI.qs("expired") ? "Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại." : UI.qs("need") ? "Vui lòng đăng nhập để xem tài khoản và đơn hàng của bạn." : "");
  </script>
</body>
</html>
